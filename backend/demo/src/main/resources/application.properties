spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_hospital}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true

app.hospital.time-zone=${HOSPITAL_TIME_ZONE:Asia/Kolkata}
app.ai.external-provider.enabled=false
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
